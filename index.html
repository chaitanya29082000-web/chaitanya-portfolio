<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chaitanya Bhambere — Computer Science Student &amp; Developer</title>
    <meta name="description" content="Portfolio of Chaitanya Bhambere, a Computer Science student building practical software and AI projects with React, TypeScript, Python, and C++." />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080B14" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chaitanya Bhambere — Computer Science Student & Developer" />
    <meta property="og:description" content="Computer Science student building practical software and AI projects with React, TypeScript, Python, and C++." />
    <meta property="og:site_name" content="Chaitanya Bhambere Portfolio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chaitanya Bhambere — Computer Science Student & Developer" />
    <meta name="twitter:description" content="Computer Science student building practical software and AI projects with React, TypeScript, Python, and C++." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        var saved = localStorage.getItem('portfolio-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
